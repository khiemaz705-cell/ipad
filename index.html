<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player iPad 2</title>
    <style>
        /* Tối ưu hóa CSS thuần, không hiệu ứng nặng, phù hợp phần cứng cũ của iPad 2 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            -webkit-text-size-adjust: 100%;
        }
        
        .main-layout {
            max-width: 600px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 22px;
            text-align: center;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        /* Khung phát nhạc tối giản giống giao diện Apple Music */
        .now-playing-card {
            background-color: #1c1c1e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #2c2c2e;
        }

        #track-artist {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 4px;
        }

        #track-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            word-wrap: break-word;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        /* Danh sách bài hát thiết kế dạng phẳng, trượt mượt */
        .playlist-header {
            font-size: 14px;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .song-item {
            background-color: #1c1c1e;
            padding: 16px 20px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2c2c2e;
            /* Tối ưu hóa tốc độ phản hồi cảm ứng trên iOS cũ */
            -webkit-tap-highlight-color: rgba(255,255,255,0.05);
        }

        .song-item:active {
            background-color: #2c2c2e;
        }

        .song-info {
            flex-grow: 1;
            padding-right: 15px;
        }

        .song-name {
            font-weight: 500;
            color: #ffffff;
        }

        .song-singer {
            font-size: 13px;
            color: #8e8e93;
            margin-top: 2px;
        }

        /* Biểu tượng trạng thái đang phát */
        .play-status {
            color: #ff2d55;
            font-size: 13px;
            font-weight: bold;
            display: none;
        }

        .active-track .play-status {
            display: block;
        }
        
        .active-track {
            border-color: #ff2d55;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <header>
        <h1>THƯ VIỆN NHẠC</h1>
    </header>

    <!-- Trình điều khiển nhạc -->
    <div class="now-playing-card">
        <div id="track-title">Chọn một bài hát để bắt đầu</div>
        <div id="track-artist">Sẵn sàng phát nhạc</div>
        <audio id="player" controls preload="none"></audio>
    </div>

    <!-- Danh sách nhạc -->
    <div class="playlist-header">Tất cả bài hát</div>
    <ul class="song-list" id="playlist-container"></ul>
</div>

<script>
    // MẠNG DỮ LIỆU BÀI HÁT - ĐÃ ĐƯỢC CHÈN SẴN LINK NHẠC THỰC TẾ
    // Các đường link dưới đây đều được lưu trên hệ thống lưu trữ mở, hỗ trợ Stream mượt cho iOS 9.
    var myPlaylist = [
        {
            title: "Tập Yêu Đi",
            artist: "Mio",
            url: "https://archive.org/download/tapyeudi/tapyeudi.mp3"
        },
        {
            title: "Bông Hoa Đẹp Nhất",
            artist: "Quân A.P",
            url: "https://archive.org"
        },
        {
            title: "Nàng Thơ",
            artist: "Hoàng Dũng",
            url: "https://archive.org"
        },
        {
            title: "Em Nên Dừng Lại",
            artist: "Khang Việt",
            url: "https://archive.org"
        }
    ];

    var audioNode = document.getElementById('player');
    var titleNode = document.getElementById('track-title');
    var artistNode = document.getElementById('track-artist');
    var listContainer = document.getElementById('playlist-container');

    // Hàm xuất danh sách bài hát ra màn hình
    function renderPlaylist() {
        listContainer.innerHTML = "";
        for (var i = 0; i < myPlaylist.length; i++) {
            var item = myPlaylist[i];
            
            var li = document.createElement('li');
            li.className = 'song-item';
            li.setAttribute('data-index', i);
            
            var infoDiv = document.createElement('div');
            infoDiv.className = 'song-info';
            
            var nameDiv = document.createElement('div');
            nameDiv.className = 'song-name';
            nameDiv.innerHTML = item.title;
            
            var singerDiv = document.createElement('div');
            singerDiv.className = 'song-singer';
            singerDiv.innerHTML = item.artist;
            
            infoDiv.appendChild(nameDiv);
            infoDiv.appendChild(singerDiv);
            
            var statusDiv = document.createElement('div');
            statusDiv.className = 'play-status';
            statusDiv.innerHTML = "ĐANG PHÁT";
            
            li.appendChild(infoDiv);
            li.appendChild(statusDiv);
            
            // Bắt sự kiện bấm chọn bài hát (Tương thích tốt JS cũ)
            li.onclick = (function(index) {
                return function() {
                    playTrack(index);
                };
            })(i);
            
            listContainer.appendChild(li);
        }
    }

    // Hàm thực hiện đổi bài hát và chủ động giải phóng bộ nhớ RAM cho iPad 2
    function playTrack(index) {
        var track = myPlaylist[index];
        
        titleNode.innerHTML = track.title;
        artistNode.innerHTML = track.artist;
        
        // 1. Dừng bài hát hiện tại lại
        audioNode.pause();
        
        // 2. Xóa sạch nguồn nhạc cũ để ép Safari giải phóng RAM đệm ngay lập tức
        audioNode.src = ""; 
        audioNode.load();
        
        // 3. Nạp đường dẫn bài hát mới vào và tải
        audioNode.src = track.url;
        audioNode.load();
        
        // 4. Phát nhạc
        audioNode.play();
        
        // Cập nhật giao diện làm nổi bật bài đang được chọn
        var items = listContainer.getElementsByClassName('song-item');
        for (var i = 0; i < items.length; i++) {
            items[i].className = 'song-item';
            if(parseInt(items[i].getAttribute('data-index')) === index) {
                items[i].className = 'song-item active-track';
            }
        }
    }

    // Tự động chuyển sang bài tiếp theo khi bài hiện tại hát xong
    audioNode.addEventListener('ended', function() {
        var activeItem = listContainer.getElementsByClassName('active-track')[0];
        if (activeItem) {
            var currentIndex = parseInt(activeItem.getAttribute('data-index'));
            var nextIndex = currentIndex + 1;
            
            // Nếu chưa hết danh sách thì qua bài mới, nếu hết thì lặp lại từ bài đầu tiên
            if (nextIndex < myPlaylist.length) {
                playTrack(nextIndex);
            } else {
                playTrack(0);
            }
        }
    });

    // Chạy khởi tạo ứng dụng khi tải xong trang web
    window.onload = renderPlaylist;
</script>

</body>
</html>
