<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Tối ưu hiển thị, khóa phóng to thu nhỏ giúp giao diện giống ứng dụng trên iPad 2 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke iPad 2</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        #player-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        #current-title {
            font-size: 22px;
            font-weight: bold;
            color: #007aff;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }
        .song-list {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
        }
        .song-item {
            background-color: #ffffff;
            margin-bottom: 12px;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            /* Tối ưu hóa phản hồi chạm cho iOS cũ không bị trễ 300ms */
            touch-action: manipulation; 
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .song-item:active {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>

    <h1>KARAOKE IPAD 2</h1>

    <div id="player-container">
        <div id="current-title">Chưa chọn bài hát</div>
        <!-- Sử dụng thuộc tính chuẩn, loại bỏ các cài đặt gây lỗi nạp nhạc cho iOS 9 -->
        <audio id="my-audio" controls preload="auto">
            Trình duyệt của bạn không hỗ trợ nghe nhạc.
        </audio>
    </div>

    <ul class="song-list">
        <!-- Đã sửa đường dẫn file nhạc gọn gàng, đưa thẳng ra thư mục gốc để tránh lỗi GitHub -->
        <li class="song-item" onclick="playSong('tapyeudi.mp3', 'Tập Yêu Đi')">
            🎵 Tập Yêu Đi
        </li>
    </ul>

    <script>
        // Sử dụng biến var để tương thích tuyệt đối với trình duyệt cũ của iOS 9
        var audioPlayer = document.getElementById('my-audio');
        var currentTitle = document.getElementById('current-title');

        function playSong(songUrl, songName) {
            currentTitle.innerHTML = "Đang phát: " + songName;
            
            // Cách nạp nguồn chuẩn xác và an toàn nhất cho Safari iOS cũ
            audioPlayer.src = songUrl;
            
            // Buộc trình duyệt nạp lại dữ liệu âm thanh mới lập tức
            audioPlayer.load();
            
            // Kích hoạt phát nhạc trực tiếp từ sự kiện click của người dùng
            var playPromise = audioPlayer.play();
            
            // Đoạn mã phòng ngừa để tránh lỗi crash script trên các trình duyệt cũ hỗ trợ Promise
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Kích hoạt phát nhạc thất bại:", error);
                });
            }
        }
    </script>

</body>
</html>
