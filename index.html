<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke iPad 2</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 28px;
        }
        #player-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        #current-title {
            font-size: 22px;
            font-weight: bold;
            color: #007aff;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }
        .song-list {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
        }
        .song-item {
            background-color: #ffffff;
            margin-bottom: 12px;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            touch-action: manipulation; 
        }
        .song-item:active {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>

    <h1>KARAOKE IPAD 2</h1>

    <div id="player-container">
        <div id="current-title">Chưa chọn bài hát</div>
        <!-- Thay đổi quan trọng cho iOS 9: Bật tự động tải trước cấu trúc nhạc bằng cách bỏ preload="none" -->
        <audio id="my-audio" controls>
            Trình duyệt của bạn không hỗ trợ nghe nhạc.
        </audio>
    </div>

    <ul class="song-list">
        <!-- Chỉnh sửa cách gọi nhạc: Truyền trực tiếp đường dẫn gốc rõ ràng hơn -->
        <li class="song-item" onclick="playSong('./music/tapyeudi.mp3', 'Tập Yêu Đi')">
            🎵 Tập Yêu Đi
        </li>
    </ul>

    <script>
        var audioPlayer = document.getElementById('my-audio');
        var currentTitle = document.getElementById('current-title');

        function playSong(songUrl, songName) {
            currentTitle.innerHTML = "Đang phát: " + songName;
            
            // Xử lý đặc biệt cho Safari iOS 9: Thiết lập lại thuộc tính nguồn trực tiếp
            audioPlayer.setAttribute('src', songUrl);
            
            // Ép trình duyệt đọc lại file âm thanh
            audioPlayer.load();
            
            // Chạy lệnh phát nhạc
            audioPlayer.play();
        }
    </script>

</body>
</html>
