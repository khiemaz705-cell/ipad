<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke iPad 2</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }
        #player-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        #current-title {
            font-size: 22px;
            font-weight: bold;
            color: #007aff;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }
        .song-list {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
        }
        .song-item {
            background-color: #ffffff;
            margin-bottom: 12px;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            touch-action: manipulation; 
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .song-item:active {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>

    <h1>KARAOKE IPAD 2</h1>

    <div id="player-container">
        <div id="current-title">Chưa chọn bài hát</div>
        
        <!-- Cải tiến 1: Khai báo sẵn thẻ source tĩnh và bật thuộc tính chuẩn cho Safari iOS 9 -->
        <audio id="my-audio" controls preload="auto">
            <source id="audio-source" src="tapyeudi.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ nghe nhạc.
        </audio>
    </div>

    <ul class="song-list">
        <!-- Cải tiến 2: Thay đổi cách gọi hàm xử lý tinh gọn hơn -->
        <li class="song-item" onclick="playNewSong('tapyeudi.mp3', 'Tập Yêu Đi')">
            🎵 Tập Yêu Đi
        </li>
    </ul>

    <script>
        var audioPlayer = document.getElementById('my-audio');
        var audioSource = document.getElementById('audio-source');
        var currentTitle = document.getElementById('current-title');

        function playNewSong(songUrl, songName) {
            currentTitle.innerHTML = "Đang phát: " + songName;
            
            // Cải tiến 3: Thay đổi thuộc tính src của cả thẻ source để ép trình duyệt iOS 9 nhận diện đúng loại MIME âm thanh
            audioSource.src = songUrl;
            audioPlayer.src = songUrl;
            
            // Ép hệ thống nạp lại và kích hoạt lại luồng dữ liệu (Stream)
            audioPlayer.load();
            
            // Lệnh phát trực tiếp tối giản để qua mặt bộ lọc bảo mật cũ của Safari
            audioPlayer.play();
        }
    </script>

</body>
</html>
